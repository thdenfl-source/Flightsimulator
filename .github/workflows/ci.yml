name: CI

# 배포 전 최소 방어선.
# 이 저장소는 빌드가 없고 index.html 이 그대로 GitHub Pages 로 나가므로,
# 문법 오류나 죽은 버튼이 그대로 사용자에게 도달한다. 그것만은 막는다.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm install --no-audit --no-fund

      - name: 문법 검사
        run: node tests/check-syntax.mjs

      - name: 크로미움 설치
        run: npx playwright install --with-deps chromium

      - name: 회귀 테스트
        run: node tests/run.mjs

      - name: 서비스워커 캐시 버전 확인
        # index.html 이 바뀌었는데 sw.js 버전을 안 올리면 사용자에게 갱신이 안 간다.
        if: github.event_name == 'pull_request'
        run: node tests/check-swver.mjs "${{ github.event.pull_request.base.sha }}"
