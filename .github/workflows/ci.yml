name: CI

# 배포 전 방어선 — 이 저장소는 빌드가 없고 index.html 이 그대로 GitHub Pages 로 나간다.
# 전체 회귀 검사를 8 조각으로 나눠 함께 돌린다(shinesong 과 같다 — 이제 SIM 검사도 모두 돈다).
# (이 경로에서는 절차 훈련판으로 돈다 — 기능은 shinesong 과 같고 비밀번호만 다르다)
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: 문법 · 캐시 번호
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 문법 검사
        run: node tests/check-syntax.mjs
      - name: 서비스워커 캐시 버전 확인
        # index.html 이 바뀌었는데 sw.js 버전을 안 올리면 사용자에게 갱신이 안 간다.
        if: github.event_name == 'pull_request'
        run: node tests/check-swver.mjs "${{ github.event.pull_request.base.sha }}"

  test:
    name: 회귀 테스트 ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 의존성 설치
        run: npm install --no-audit --no-fund
      - name: 크로미움 설치
        run: npx playwright install --with-deps chromium
      - name: 회귀 테스트
        env:
          SHARD: ${{ matrix.shard }}/8
          TIMING: '1'
        run: node tests/run.mjs
